  input#q{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);

  input#q:focus{outline:2px solid var(--mint);outline-offset:1px}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{font:inherit;font-size:14px;font-weight:700;padding:7px 13px;border:0;background:#fff;

  .seg button.on{background:var(--mint);color:#fff}
  .stat{font-size:14px;font-weight:800;color:var(--mint);margin-left:auto}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 18px}

    color:var(--grey);border-radius:999px;padding:6px 13px;cursor:pointer}
  .chip b{color:var(--navy)}
  .chip.on{background:var(--mint);border-color:var(--mint);color:#fff}
  .chip.on b{color:#fff}
  .chip.fav{border-color:#f0d7a8;color:var(--gold)}
  h2.g{font-size:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--mint);
    margin:26px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px}
  h2.g span{color:var(--grey);font-weight:600;text-transform:none;letter-spacing:0}
  .grid{display:grid;gap:10px;grid-template-columns:1fr}
  @media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:1060px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .card{position:relative;background:#fff;border:1px solid var(--line);border-radius:13px;
    padding:12px 14px;transition:.13s}
  .card:hover{border-color:var(--mint);box-shadow:0 6px 18px rgba(27,58,92,.12);transform:translateY(-1px)}
  .card a{text-decoration:none;color:inherit;display:block}
  .card .m a{display:inline-block;font-weight:700;color:var(--mint)}
  .card .m a.src{font-weight:400;color:var(--grey)}
  .card .m a.src:hover{color:var(--navy)}
  .card .m .nopage{font-weight:400;color:var(--grey);opacity:.8}
  .t{font-size:16.5px;font-weight:800;line-height:1.25;padding-right:28px;word-break:break-word}
  .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;color:var(--grey)}
  .b{background:#eef7f6;border:1px solid #dbeae7;border-radius:6px;padding:1px 7px;font-weight:700}
  .b.t2{background:#f5f1e6;border-color:#e9dfc6}
  .star{position:absolute;top:9px;right:9px;border:0;background:none;font-size:19px;line-height:1;
    cursor:pointer;color:#c9d6d4;padding:3px}
  .star.on{color:var(--gold)}
  .empty{padding:50px 12px;text-align:center;color:var(--grey);font-size:16px}
  footer{margin-top:36px;text-align:center;font-size:13.5px;color:var(--grey);line-height:1.6}
  kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px}

}

  if(state.onlyFav && !favs.has(r.name)) return false;

  // chips
  const groups = state.group === "course" ? [["ОГЭ · OGE", 14], ["ЕГЭ · EGE", 7], ["Spotlight 8", 54], ["Spotlight 6", 1], ["Spotlight", 1], ["Starlight", 23], ["Solutions Advanced", 22], ["Solutions Pre-Int / Int", 4], ["Own It!", 7], ["GRAMMAR", 38], ["Без курса · No course", 30]] : [["Grammar", 96], ["Vocabulary", 26], ["Flashcards", 25], ["Speaking", 12], ["Translation", 3], ["Reading & topics", 16], ["Tests & revision", 5], ["Unit packs", 16], ["Прочее · Other", 2]];
  let chips = '<button class="chip' + (state.cat === null && !state.onlyFav ? ' on' : '') + '" data-cat="">Все <b>' + total + '</b></button>';
  chips += '<button class="chip fav' + (state.onlyFav ? ' on' : '') + '" data-fav="1">★ Избранное <b>' + favs.size + '</b></button>';
  groups.forEach(g => {
    const n = REPOS.filter(r => (state.group === "course" ? r.course : r.type) === g[0]).length;
    if(!n) return;
    chips += '<button class="chip' + (state.cat === g[0] ? ' on' : '') + '" data-cat="' + g[0] + '">'
      + g[0] + ' <b>' + n + '</b></button>';
  });
  $("#chips").innerHTML = chips;

  if(!rows.length){
    const why = state.q ? 'По запросу «' + esc(state.q) + '» ничего не найдено.'
                        : (state.onlyFav ? 'В избранном пока пусто.' : 'Здесь пока ничего нет.');
    $("#list").innerHTML = '<div class="empty">' + why
      + '<br><button class="chip" data-reset="1" style="margin-top:14px;font-size:15px">'
      + 'Показать все материалы</button></div>';
    return;
  }

  let out = "";
  if(favs.size && !state.onlyFav && !state.cat && !state.q){
    const favRows = rows.filter(r => favs.has(r.name));
    if(favRows.length){
      out += '<h2 class="g">★ Избранное <span>(' + favRows.length + ')</span></h2><div class="grid">'
        + favRows.map(card).join("") + '</div>';
    }
  }
  const by = {};
  rows.forEach(r => { const g = state.group === "course" ? r.course : r.type; (by[g] = by[g] || []).push(r); });
  const order = state.group === "course" ? ["ОГЭ · OGE", "ЕГЭ · EGE", "Spotlight 8", "Spotlight 6", "Spotlight", "Starlight", "Solutions Advanced", "Solutions Pre-Int / Int", "Own It!", "GRAMMAR", "Без курса · No course"] : ["Grammar", "Vocabulary", "Flashcards", "Speaking", "Translation", "Reading & topics", "Tests & revision", "Unit packs", "For students", "Прочее · Other"];
  const names = Object.keys(by).sort((a,b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || by[b].length - by[a].length;
  });
  names.forEach(g => {
    out += '<h2 class="g">' + g + ' <span>(' + by[g].length + ')</span></h2>'
      + '<div class="grid">' + by[g].map(card).join("") + '</div>';
  });
  $("#list").innerHTML = out;
}

$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#chips").addEventListener("click", e => {
  const fav = e.target.closest("[data-fav]");
  if(fav){ state.onlyFav = !state.onlyFav; state.cat = null; clearSearch(); render(); return; }
  const c = e.target.closest("[data-cat]");
  if(c){
    const val = c.dataset.cat || null;
    state.cat = (state.cat === val) ? null : val;   // click the active chip again = show everything
    state.onlyFav = false;
    clearSearch();                                   // a chip is a fresh view, not a filter on top of the search
    render();
  }
});
$("#list").addEventListener("click", e => {
  if(e.target.closest("[data-reset]")){
    state.cat = null; state.onlyFav = false; clearSearch(); render(); return;
  }
  const b = e.target.closest("[data-star]");
  if(!b) return;
  e.preventDefault();
  const n = b.dataset.star;
  if(favs.has(n)) favs.delete(n); else favs.add(n);
  saveFavs(); render();
});
document.querySelectorAll(".seg button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach(x => x.classList.remove("on"));
    btn.classList.add("on");
    state.group = btn.dataset.group; state.cat = null; render();
  });
});
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
  if(e.key === "Escape" && document.activeElement === $("#q")){
    $("#q").value = ""; state.q = ""; render(); $("#q").blur(); }
});
render();
</script>
